name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: cpu
            torch_index: https://download.pytorch.org/whl/cpu
          - edition: nvidia
            torch_index: https://download.pytorch.org/whl/cu124
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url ${{ matrix.torch_index }}
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Get ffmpeg
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $exe = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          "FFMPEG_BIN=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Build
        run: pyinstaller --noconfirm voice_maker.spec

      - name: Smoke test (real model, CPU)
        if: matrix.edition == 'cpu'
        timeout-minutes: 60
        run: |
          $exe = "dist\VoiceMaker\VoiceMaker.exe"
          $log = "$env:LOCALAPPDATA\VoiceMaker\voice_maker.log"
          function Run-App($argList, $minutes) {
            $p = Start-Process $exe -ArgumentList $argList -PassThru
            if (-not $p.WaitForExit($minutes * 60000)) { Stop-Process -Id $p.Id -Force; Write-Host "::warning::VoiceMaker $($argList[0]) timed out after $minutes min" }
          }
          function Show-Log($title) {
            # Shown as an annotation so the result is readable from the API.
            $tail = (Get-Content $log -Tail 25 -ErrorAction SilentlyContinue) -join "%0A"
            Write-Host "::notice title=$title::$tail"
          }
          & $env:FFMPEG_BIN -loglevel error -f lavfi -i "sine=frequency=160:duration=8" -ar 24000 -ac 1 ref.wav
          Run-App @('clip','https://www.youtube.com/watch?v=jNQXAC9IVRw','0:01','0:12','yt.wav') 5
          if (Test-Path yt.wav) { Write-Host "::notice::YouTube clip download worked"; $ref = "yt.wav" } else { Show-Log "YouTube clip log"; $ref = "ref.wav" }
          $start = Get-Date
          Run-App @('say','--device','cpu','--ref',$ref,'--out','smoke.mp3','"Hello, this is a test of Voice Maker."') 45
          Show-Log "Voice generation log"
          if (-not (Test-Path smoke.mp3)) { throw "Smoke test produced no MP3" }
          $dur = & ($env:FFMPEG_BIN -replace 'ffmpeg.exe$','ffprobe.exe') -v error -show_entries format=duration -of csv=p=0 smoke.mp3
          Write-Host "::notice::Smoke test MP3: $dur seconds, generated in $([int]((Get-Date)-$start).TotalSeconds) s (includes model download)"
          Run-App @('say','--device','cpu','--ref',$ref,'--legato','meow','--cat-accent','--purr','0.8','--trill','0.3','--chirp','0.25','--out','smoke_meow.mp3','"Hello there. Meow."') 30
          Show-Log "Cat legato log"
          if (-not (Test-Path smoke_meow.mp3)) { throw "Cat legato smoke test produced no MP3" }
          Run-App @('voice','add','Smoke','--file',$ref,'--cat-clip') 5
          Run-App @('say','--device','cpu','--voice','Smoke','--out','smoke_voice.mp3','"Hello from a saved voice."') 30
          Show-Log "Saved voice log"
          if (-not (Test-Path smoke_voice.mp3)) { throw "Saved voice smoke test produced no MP3" }

      - name: Upload smoke test audio
        if: matrix.edition == 'cpu'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-audio
          path: |
            smoke.mp3
            smoke_meow.mp3
            smoke_voice.mp3
            yt.wav
          if-no-files-found: ignore

      - name: Package
        run: |
          Copy-Item README.md dist\VoiceMaker\
          if ("${{ matrix.edition }}" -eq "cpu") {
            7z a -tzip -mx=5 VoiceMaker-windows-cpu.zip .\dist\VoiceMaker
          } else {
            # Release files are capped at 2 GB, so the big NVIDIA build is split into 1.9 GB 7-Zip parts.
            7z a -t7z -mx=5 -v1900m VoiceMaker-windows-nvidia.7z .\dist\VoiceMaker
          }
          Get-ChildItem VoiceMaker-windows-*

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceMaker-${{ matrix.edition }}
          path: VoiceMaker-windows-*
          compression-level: 0

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: VoiceMaker-*
          merge-multiple: true
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VoiceMaker-windows-* --target ${{ github.sha }} --title "Voice Maker (latest build)" --notes "Download the CPU edition if you are unsure. The NVIDIA edition is much faster on an NVIDIA graphics card; download every part (.001, .002, ...) into one folder and open the .001 file with 7-Zip. Extract, then run VoiceMaker\\VoiceMaker.exe. The voice model (about 3 GB) downloads the first time you generate."
